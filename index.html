<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Vibe-Coded Asteroids | Vanilla JS Canvas Game</title>
    <meta
      name="description"
      content="A vibe-coded Asteroids game built with vanilla JavaScript and full-screen canvas, inspired by codingchallenges.fyi."
    />
    <link rel="canonical" href="https://emh.io/asteroids" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://emh.io/asteroids" />
    <meta property="og:title" content="Vibe-Coded Asteroids | Vanilla JS Canvas Game" />
    <meta
      property="og:description"
      content="A vibe-coded Asteroids game built with vanilla JavaScript and full-screen canvas, inspired by codingchallenges.fyi."
    />
    <meta property="og:image" content="https://emh.io/asteroids/asteroids.png" />
    <meta property="og:image:alt" content="Screenshot of the Vibe-Coded Asteroids game" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vibe-Coded Asteroids | Vanilla JS Canvas Game" />
    <meta
      name="twitter:description"
      content="A vibe-coded Asteroids game built with vanilla JavaScript and full-screen canvas, inspired by codingchallenges.fyi."
    />
    <meta name="twitter:image" content="https://emh.io/asteroids/asteroids.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="app">
      <canvas id="game" aria-label="Asteroids game canvas"></canvas>

      <section id="mobile-controls" aria-label="Mobile controls" hidden>
        <div class="dpad-zone" id="dpad-zone" aria-label="Directional pad">
          <span class="dpad-arrow dpad-arrow-up" aria-hidden="true">&uarr;</span>
          <span class="dpad-arrow dpad-arrow-left" aria-hidden="true">&larr;</span>
          <span class="dpad-arrow dpad-arrow-right" aria-hidden="true">&rarr;</span>
          <span class="dpad-arrow dpad-arrow-down" aria-hidden="true">&darr;</span>
          <div class="dpad-thumb" id="dpad-thumb" aria-hidden="true"></div>
        </div>
        <button class="control-btn fire-btn" id="fire-btn" aria-label="Fire weapon"></button>
      </section>
    </main>
    <script src="main.js"></script>
  </body>
</html>
